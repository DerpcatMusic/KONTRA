name: Bug report
description: Something sounds, loads, looks or behaves wrong, or KONTRA crashed
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! One problem per report, with a title that says what you see ("Una Corda: EQ knobs do nothing").
        Please do not attach commercial presets, samples, `.nicnt` files, extracted scripts or library artwork.
  - type: input
    id: version
    attributes:
      label: KONTRA version
      description: From the About panel, for example 3.1.0.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and plugin format
      placeholder: Bitwig 5.3, CLAP, Linux
    validations:
      required: true
  - type: input
    id: library
    attributes:
      label: Library and instrument
      placeholder: Areia, 16 Violins Spiccato Fast
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Playback timing / double attacks, Sound differs from Kontakt/UVI, Loading, Script / UI, CPU / memory, Crash, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Live MIDI or DAW playback? Block size and sample rate if timing related.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: If you know what the original sampler does here, say so.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or crash text
      description: Optional. Anything the host or KONTRA printed, checked for private data.
      render: text
