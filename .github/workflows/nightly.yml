name: Nightly

# Every public main update builds an experimental versioned nightly snapshot.
# GitHub Latest links serve the newest complete snapshot. Each source snapshot publishes; publication finishes uninterrupted.
# Standard GitHub-hosted runners are free for public repositories.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  # The MOOSE revision Cargo.toml pins; cargo-moose must match it.
  MOOSE_REV: bffa4677d0b82119d38566ce7e932dc5c463d497
  # Extra Cargo features for every build.
  FEATURES: library-access

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    uses: ./.github/workflows/ci.yml
    with:
      release_validation: true

  # Package the same SHA while shipping checks run; publication still needs both.
  build:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    concurrency:
      group: nightly-build-${{ matrix.name }}-${{ github.sha }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, name: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x86_64}
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Nightly version
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/version.py nightly --write
          echo "KONTRA_NIGHTLY_BUILD=1" >> "$GITHUB_ENV"
      - name: License bundle checks
        shell: bash
        run: python3 tools/licenses.py --self-test
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: nightly-${{ matrix.os }}-${{ matrix.target }}-release
      - name: Install cargo-moose
        shell: bash
        run: cargo install --locked --git https://github.com/Matari-Audio/moose --rev "$MOOSE_REV" cargo-moose
      - name: CLAP and VST3 bundles
        shell: bash
        run: |
          cargo moose build --clap --vst3 ${FEATURES:+--features "$FEATURES"} --target ${{ matrix.target }}
          python3 - <<'PYINFO'
          import glob, json, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          # cargo-moose builds each format with --no-default-features.
          for format in ("clap", "vst3"):
              matches = []
              for path in glob.glob("target/${{ matrix.target }}/release/build/kontakto-*/out/kontra-build.json"):
                  info = json.loads(pathlib.Path(path).read_text())
                  features = set(info["features"])
                  if (info["version"] == version and info["revision"] == os.environ["GITHUB_SHA"]
                      and info["target"] == "${{ matrix.target }}" and info["profile"] == "release"
                      and {"plugin", "library-access", format} <= features
                      and not ({"clap", "vst3", "standalone"} - {format}) & features):
                      matches.append(path)
              assert len(matches) == 1, (format, matches)
              assert json.loads(pathlib.Path(matches[0]).read_text())["dirty"] is False, "Dirty Nightly source"
              pathlib.Path(format + "-build-info.json").write_bytes(pathlib.Path(matches[0]).read_bytes())
          PYINFO
      - name: Standalone
        shell: bash
        run: cargo build --release --features "standalone${FEATURES:+,$FEATURES}" --bin kontakto-standalone --target ${{ matrix.target }}
      - name: Dependency licenses and covered source
        shell: bash
        run: |
          cargo install --locked --version 0.9.2 --features cli cargo-about
          python3 tools/licenses.py --output license-bundle
      - name: Stage
        shell: bash
        run: |
          stage="KONTRA-nightly-${{ matrix.name }}"
          exe=kontakto-standalone; [ "$RUNNER_OS" = Windows ] && exe=kontakto-standalone.exe
          "target/${{ matrix.target }}/release/$exe" --build-info > standalone-build-info.json
          python3 -c 'import json; assert json.load(open("standalone-build-info.json"))["dirty"] is False, "Dirty Nightly source"'
          if [ "$RUNNER_OS" != macOS ]; then
            python3 .github/scripts/stage_nightly.py --platform "${{ matrix.name }}" --stage "$stage" \
              --bundles "target/bundles/${{ matrix.target }}" --standalone "target/${{ matrix.target }}/release/$exe" \
              --licenses license-bundle --revision "$GITHUB_SHA" --clap-info clap-build-info.json \
              --vst3-info vst3-build-info.json --standalone-info standalone-build-info.json
          else
          mkdir "$stage"
          cp -R "target/bundles/${{ matrix.target }}/KONTRA.clap" "target/bundles/${{ matrix.target }}/KONTRA.vst3" "$stage/"
          exe=kontakto-standalone; [ "$RUNNER_OS" = Windows ] && exe=kontakto-standalone.exe
          cp "target/${{ matrix.target }}/release/$exe" "$stage/"
          cp LICENSE NOTICE THIRD_PARTY.md "$stage/"
          mkdir -p "$stage/assets" "$stage/docs"
          cp assets/OFL.txt "$stage/assets/"
          cp docs/LEGAL.md "$stage/docs/"
          cp -R license-bundle "$stage/licenses"
          cp clap-build-info.json vst3-build-info.json "$stage/"
          printf '%s\n' "$GITHUB_SHA" > "$stage/SOURCE_COMMIT.txt"
          cp standalone-build-info.json "$stage/build-info.json"
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$stage/KONTRA.app/Contents/MacOS"
            mv "$stage/$exe" "$stage/KONTRA.app/Contents/MacOS/KONTRA"
            python3 - "$stage" <<'PYAPP'
          import json, pathlib, plistlib, sys
          sys.path.insert(0, '.github/scripts')
          from package_macos import app_info
          stage = pathlib.Path(sys.argv[1])
          (stage / 'KONTRA.app/Contents/Info.plist').write_bytes(plistlib.dumps(app_info(json.loads((stage / 'build-info.json').read_text())['version'])))
          PYAPP
          fi
          fi
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - name: Verify Linux glibc baseline
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/check_glibc.py "$STAGE/KONTRA.clap" \
            "$STAGE/KONTRA.vst3/Contents/x86_64-linux/KONTRA.so" "$STAGE/kontakto-standalone"
      - name: Normalize macOS bundle versions
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PYPLIST'
          import os, pathlib, plistlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          for bundle in ("KONTRA.clap", "KONTRA.vst3"):
              path = pathlib.Path(os.environ["STAGE"]) / bundle / "Contents/Info.plist"
              info = plistlib.loads(path.read_bytes())
              info.update(CFBundleShortVersionString=version.split("-", 1)[0], CFBundleVersion=version.split("-", 1)[0], KONTRAVersion=version)
              path.write_bytes(plistlib.dumps(info, sort_keys=False))
          PYPLIST
      - name: Developer ID sign and notarize macOS
        if: runner.os == 'macOS'
        env:
          APPLE_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KONTRA_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/notarize_macos.sh
      - name: Zip
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$STAGE.zip" ;;
            Windows) 7z a -tzip "$STAGE.zip" "$STAGE" > /dev/null ;;
            *) zip -qry "$STAGE.zip" "$STAGE" ;;
          esac
          python3 - <<'PYHASH'
          import hashlib, os, pathlib
          archive = pathlib.Path(os.environ["STAGE"] + ".zip")
          archive.with_suffix(".zip.sha256").write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + "  " + archive.name + "\n")
          PYHASH
      - name: Verify macOS ZIP bundle recognition and factory discovery
        if: runner.os == 'macOS'
        run: |
          ditto -x -k "$STAGE.zip" extracted-plugins
          xcrun swift .github/scripts/check_macos_bundles.swift --register "extracted-plugins/$STAGE/KONTRA.app" \
            "extracted-plugins/$STAGE/KONTRA.clap" "extracted-plugins/$STAGE/KONTRA.vst3"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.STAGE }}
          path: |
            ${{ env.STAGE }}.zip
            ${{ env.STAGE }}.zip.sha256
            ${{ env.STAGE }}.build.json
            KONTRA-nightly-covered-source.zip
          if-no-files-found: error
          retention-days: 1

  macos-universal:
    needs: build
    runs-on: macos-15
    concurrency:
      group: nightly-build-macos-universal-${{ github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: KONTRA-nightly-macos-*
          merge-multiple: true
      - name: Universal installer orchestration checks
        run: python3 .github/scripts/test_package_macos.py
      - name: Compose, sign and notarize the universal installer
        env:
          APPLE_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_INSTALLER_CERTIFICATE_P12_BASE64 APPLE_DEVELOPER_ID_INSTALLER; do
            [ -n "${!name:-}" ] || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          for arch in arm64 x86_64; do
            ditto -x -k "dist/KONTRA-nightly-macos-$arch.zip" inputs
          done
          version=$(python3 -c 'import json; print(json.load(open("inputs/KONTRA-nightly-macos-arm64/build-info.json"))["version"])')
          source .github/scripts/macos_signing_keychain.sh
          python3 .github/scripts/package_macos.py --arm64 inputs/KONTRA-nightly-macos-arm64 \
            --x86-64 inputs/KONTRA-nightly-macos-x86_64 --stage universal-stage \
            --revision "$GITHUB_SHA" --version "$version"
          bash .github/scripts/package_macos.sh universal-stage dist/KONTRA-nightly-macos-universal.pkg
      - name: Validate native installation and explicit rollback
        run: |
          set -euo pipefail
          package=dist/KONTRA-nightly-macos-universal.pkg
          pkgutil --expand "$package" expanded-installer
          find expanded-installer -name PackageInfo -exec cat {} \;
          sudo installer -pkg "$package" -target /
          # Prove a deliberately newer installed version cannot suppress rollback.
          for bundle in /Library/Audio/Plug-Ins/CLAP/KONTRA.clap /Library/Audio/Plug-Ins/VST3/KONTRA.vst3 /Applications/KONTRA.app; do
            sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 999999' "$bundle/Contents/Info.plist"
          done
          sudo installer -pkg "$package" -target /
          python3 - <<'PYINSTALL'
          import hashlib, pathlib, subprocess
          payload = pathlib.Path('universal-stage/payload')
          for relative in ('Library/Audio/Plug-Ins/CLAP/KONTRA.clap',
                           'Library/Audio/Plug-Ins/VST3/KONTRA.vst3', 'Applications/KONTRA.app'):
              expected, installed = payload / relative, pathlib.Path('/') / relative
              def inventory(root):
                  return {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                          for p in root.rglob('*') if p.is_file()}
              assert inventory(expected) == inventory(installed), f'Installed payload differs: {relative}'
              subprocess.run(['lipo', str(installed / 'Contents/MacOS/KONTRA'),
                              '-verify_arch', 'arm64', 'x86_64'], check=True)
              subprocess.run(['codesign', '--verify', '--deep', '--strict', '--all-architectures',
                              str(installed)], check=True)
              print(f'Installed and rollback-verified: /{relative}')
          PYINSTALL
          xcrun swift .github/scripts/check_macos_bundles.swift --register /Applications/KONTRA.app \
            /Library/Audio/Plug-Ins/CLAP/KONTRA.clap /Library/Audio/Plug-Ins/VST3/KONTRA.vst3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KONTRA-nightly-macos-universal
          path: |
            dist/KONTRA-nightly-macos-universal.pkg
            dist/KONTRA-nightly-macos-universal.notarization.json
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [verify, build, macos-universal]
    runs-on: ubuntu-24.04
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: KONTRA-nightly-*
          merge-multiple: true
      - name: Nightly version
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/version.py nightly --write
      - name: Publish the experimental nightly
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/workflows/publish_nightly.py
      - name: Remove released Actions artifacts
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release ZIPs are independent; delete only this run's transient copies.
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("KONTRA-nightly-")) | .id' |
            while read -r artifact; do
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact"
            done
