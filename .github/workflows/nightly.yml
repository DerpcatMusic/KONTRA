name: Nightly

# Build a changed public-main snapshot daily, or explicitly on demand.
# Verify this exact candidate before packaging. Publishing is never cancelled.
# Standard GitHub-hosted runners are free for public repositories.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  # The MOOSE revision Cargo.toml pins; cargo-moose must match it.
  MOOSE_REV: bffa4677d0b82119d38566ce7e932dc5c463d497
  # Extra Cargo features for every build.
  FEATURES: library-access

jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for build-relevant changes since the published snapshot
        id: changes
        env:
          BEFORE: refs/tags/nightly
          AFTER: ${{ github.sha }}
          # Manual dispatch intentionally allows rechecking the same revision.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 .github/scripts/ci_changes.py

  verify:
    needs: candidate
    if: needs.candidate.outputs.code == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release_validation: true

  build:
    needs: [candidate, verify]
    if: needs.candidate.outputs.code == 'true' && needs.verify.result == 'success'
    concurrency:
      group: nightly-build-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, name: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x86_64}
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}-library-access-standalone
      - name: Install cargo-moose
        shell: bash
        run: cargo install --locked --git https://github.com/Matari-Audio/moose --rev "$MOOSE_REV" cargo-moose
      - name: CLAP and VST3 bundles
        shell: bash
        run: cargo moose build --clap --vst3 ${FEATURES:+--features "$FEATURES"} --target ${{ matrix.target }}
      - name: Standalone
        shell: bash
        run: cargo build --locked --release --features "standalone${FEATURES:+,$FEATURES}" --bin kontakto-standalone --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          stage="KONTRA-nightly-${{ matrix.name }}"
          mkdir "$stage"
          cp -R "target/bundles/${{ matrix.target }}/KONTRA.clap" "target/bundles/${{ matrix.target }}/KONTRA.vst3" "$stage/"
          exe=kontakto-standalone; [ "$RUNNER_OS" = Windows ] && exe=kontakto-standalone.exe
          cp "target/${{ matrix.target }}/release/$exe" "$stage/"
          cp LICENSE NOTICE THIRD_PARTY.md "$stage/"
          printf '%s\n' "$GITHUB_SHA" > "$stage/SOURCE_COMMIT.txt"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "$STAGE/KONTRA.clap" "$STAGE/KONTRA.vst3" "$STAGE/kontakto-standalone"
          codesign --verify --deep --verbose=2 "$STAGE/KONTRA.clap" "$STAGE/KONTRA.vst3"
      - name: Zip
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$STAGE.zip" ;;
            Windows) 7z a -tzip "$STAGE.zip" "$STAGE" > /dev/null ;;
            *) zip -qry "$STAGE.zip" "$STAGE" ;;
          esac
          # GitHub artifact digest warnings alone are not a fail-closed ZIP check.
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$STAGE.zip" > "$STAGE.zip.sha256"
          else
            sha256sum "$STAGE.zip" > "$STAGE.zip.sha256"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.STAGE }}
          path: |
            ${{ env.STAGE }}.zip
            ${{ env.STAGE }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [candidate, verify, build]
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: KONTRA-nightly-*
          merge-multiple: true
      - name: Publish the nightly pre-release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Download-artifact defaults to this run: never mix commits or reruns.
          for platform in linux-x86_64 windows-x86_64 macos-arm64 macos-x86_64; do
            test -s "dist/KONTRA-nightly-$platform.zip"
            (cd dist && sha256sum --check "KONTRA-nightly-$platform.zip.sha256")
          done
          if [ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            echo "Superseded by a newer main commit; keeping the current nightly."
            exit 0
          fi
          short=${GITHUB_SHA::7}
          cat > notes.md <<EOF
          Automated build of [$short](https://github.com/$GH_REPO/commit/$GITHUB_SHA) ($(date -u +%Y-%m-%d)). Passed automated release-profile CI at this source commit; experimental snapshot, not DAW certification.

          Contents per platform: KONTRA.clap, KONTRA.vst3 and kontakto-standalone.
          macOS builds are signed ad hoc and not notarized: after unzipping, run
          \`xattr -dr com.apple.quarantine KONTRA.clap KONTRA.vst3 kontakto-standalone\`.
          x86_64 plug-ins require an x86-64-v3 CPU (AVX2, FMA and BMI2).
          EOF
          # Upload a complete replacement before touching the public release.
          staging=nightly-staging
          # A runner failure may leave a draft; keep staging history bounded.
          leftover=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "nightly-staging") | .id')
          if [ -n "$leftover" ]; then gh release delete "$staging" --yes; fi
          trap 'gh release delete "$staging" --yes >/dev/null 2>&1 || true' EXIT
          gh release create "$staging" dist/*.zip --draft --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ${short}" --notes-file notes.md
          if [ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            gh release delete "$staging" --yes
            exit 0
          fi
          previous=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "nightly") | .id')
          if [ -n "$previous" ]; then gh release delete nightly --yes --cleanup-tag; fi
          gh release edit "$staging" --tag nightly --draft=false --target "$GITHUB_SHA" --latest=false
          trap - EXIT
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Remove released Actions artifacts
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release ZIPs are independent; delete only this run's transient copies.
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("KONTRA-nightly-")) | .id' |
            while read -r artifact; do
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact"
            done
