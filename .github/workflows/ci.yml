name: CI

# Keep the workflow present for every PR. Only known documentation-only changes
# skip expensive jobs; `CI required` still reports success/failure.
# Public main pushes run this exact workflow through Nightly in release mode.
# PR/merge-group checks remain independent; avoid a second ordinary CI push run.
on:
  # Stacked PRs (based on another PR's branch) wait: they run once retargeted
  # to v3 or main and pushed.
  pull_request:
    branches: [main, v3]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      release_validation:
        description: Test the shipping ThinLTO profile (slower)
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_validation:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  APP_GIT_REVISION: ${{ github.sha }}
  MUI_REPORTING_DISABLED: "1"
  CARGO_TARGET_DIR: target
  # Snapshots call this same workflow at their exact source commit, in release mode.
  CI_PROFILE: ${{ inputs.release_validation && 'release' || 'ci' }}
  # First-party crates (cargo test/clippy at the workspace root covers only the root package).
  # The shipping (v2) crates and the v3 kontra-* crates build in separate cargo runs:
  # one run unifies features, and v3's Luau needs mlua's `send` feature, which v2's
  # Rc-based Lua hosts cannot take. No package links both. P8 deletes v2.
  CRATES: >-
    -p kontakto -p sampler-core -p sampler-ir -p sampler-simd -p sampler-pool -p sampler-ksp
    -p sampler-kontakt -p sampler-uvi -p sampler-midi -p sampler-native -p kontra-ui-model
    -p sampler-perf -p sampler-parity -p corpus-health
  V3_CRATES: >-
    -p kontra-time -p kontra-law -p kontra-macros -p kontra-params
    -p kontra-events -p kontra-ui-model -p kontra-protocol -p kontra-dsp-core
    -p kontra-dsp-filter -p kontra-dsp-eq -p kontra-dsp-dynamics -p kontra-dsp-delay
    -p kontra-dsp-reverb -p kontra-dsp-drive -p kontra-dsp-spatial -p kontra-dsp-modulators
    -p kontra-dsp -p kontra-stream -p kontra-voice -p kontra-vm
    -p kontra-engine -p kontra-ksp -p kontra-lua -p kontra-format
    -p kontra-format-kontakt -p kontra-format-uvi -p kontra-format-sfz -p kontra-format-native
    -p kontra-library -p kontra-align -p kontra-ui -p kontra-host

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Version consistency
        run: |
          python3 tools/version.py check
          python3 tools/version.py self-test
          python3 tools/test_version.py
          python3 - <<'PYDEPS'
          import pathlib, tomllib
          packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          windows = lambda package: next(d for d in package['dependencies'] if d.startswith('windows '))
          allocator = next(p for p in packages if p['name'] == 'gpu-allocator')
          for hal in (p for p in packages if p['name'] == 'wgpu-hal'):
              assert windows(allocator) == windows(hal), 'DX12 allocator and wgpu-hal must share Windows interface types'
          PYDEPS
      - name: KSP surface map (catalogue in sync, full rows keep their test, fixture scripts pass doctor --strict)
        run: |
          python3 tools/re/ksp_symbols.py check
          python3 tools/re/test_ksp_symbols.py
          python3 tools/re/ksp_symbols.py doctor tools/re/fixtures/ksp/*.ksp --strict
      - name: Classify changes
        id: changes
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
          FORCE: ${{ inputs.release_validation || (github.event_name != 'push' && github.event_name != 'pull_request') }}
        run: python3 .github/scripts/ci_changes.py
      # Draft PRs (agent swarms, WIP) skip the expensive jobs; marking ready runs them.
      - name: Skip drafts
        if: github.event.pull_request.draft == true
        run: echo "code=false" >> "$GITHUB_OUTPUT"
      - name: Workflow syntax and expression checks
        run: bash .github/scripts/check_workflows.sh
      - name: Workflow safety tests
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Shipping integration executables compile in eight independent jobs below.
    # Keep the existing 180-minute shipping / 90-minute ordinary bounds.
    timeout-minutes: ${{ inputs.release_validation && 180 || 90 }}
    concurrency:
      group: ci-linux-${{ github.workflow }}-${{ inputs.release_validation && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Nightly shipping identity
        if: inputs.release_validation || github.event_name == 'pull_request'
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/test_version.py
          python3 tools/version.py nightly --write
          python3 tools/version.py nightly-dirty
          echo "KONTRA_NIGHTLY_BUILD=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: System libraries (X11, OpenGL/Vulkan, ALSA, JACK)
        run: |
          mkdir -p ui-plugin/editor-debs/partial
          sudo apt-get update
          # Retain the exact packages for offline editor setup on the same runner image.
          sudo apt-get -o Dir::Cache::archives="$PWD/ui-plugin/editor-debs" \
            -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            dbus-x11 mesa-utils vulkan-tools ffmpeg unzip ripgrep libegl1 \
            libfreetype6 libfontconfig1 libxext6 libxrender1 libxinerama1 \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers xvfb xauth \
            libasound2-dev libjack-jackd2-dev
          # apt owns partial/; Cargo must be able to scan the workspace.
          sudo chmod -R a+rX ui-plugin/editor-debs
          (cd ui-plugin/editor-debs && sha256sum *.deb > SHA256SUMS)
      - name: VST3 native shim editor lifecycle
        run: |
          for test in editor_attach editor_lifetime; do
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic "vendor/moose-vst3/tests/$test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ env.CI_PROFILE }}-default
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true
          cache-workspace-crates: true
      # Existing formatting debt remains advisory; do not reformat unrelated code.
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: clippy
        # The root package plus every first-party sampler crate; vendored crates are
        # checked only as dependencies.
        run: |
          cargo clippy --locked --profile "$CI_PROFILE" --all-targets $CRATES
          cargo clippy --locked --profile "$CI_PROFILE" --all-targets $V3_CRATES
      - name: test
        if: ${{ !inputs.release_validation }}
        # Ordinary PR CI retains its complete default-target command.
        # library-access is already a default feature; this includes access::*.
        run: |
          cargo test --locked --profile "$CI_PROFILE" $CRATES
          cargo test --locked --profile "$CI_PROFILE" $V3_CRATES
      - name: Format feature matrix (optional formats off, then each on alone)
        if: ${{ !inputs.release_validation }}
        # Kontakt and UVI are still unconditional in the root; only ample and ikmpak toggle.
        # --no-default-features also turns off library-access in kontakt and uvi (first check).
        run: |
          cargo check --locked --profile "$CI_PROFILE" -p kontakto --no-default-features --lib
          cargo check --locked --profile "$CI_PROFILE" -p kontakto --no-default-features --features plugin --lib
          cargo check --locked --profile "$CI_PROFILE" -p kontakto --no-default-features --features plugin,format-ample --lib
          cargo check --locked --profile "$CI_PROFILE" -p kontakto --no-default-features --features plugin,format-ikmpak --lib
          cargo test --locked --profile "$CI_PROFILE" -p kontakto --no-default-features --features plugin,format-ample --lib formats::
          cargo test --locked --profile "$CI_PROFILE" -p kontakto --no-default-features --features plugin,format-ikmpak --lib formats::
      - name: Shipping library, binary, documentation and example coverage
        if: inputs.release_validation
        # Match Cargo's default target coverage: examples build, never execute.
        # Only integration executables move to the shipping-only matrix.
        run: |
          cargo metadata --locked --no-deps --format-version 1 > shipping-unit-metadata.json
          python3 .github/scripts/shipping_tests.py plan \
            --metadata shipping-unit-metadata.json --crates "$CRATES" --source "$GITHUB_SHA" \
            --plan shipping-unit-plan.json
          python3 .github/scripts/shipping_tests.py units \
            --metadata shipping-unit-metadata.json --crates "$CRATES" --source "$GITHUB_SHA" \
            --plan shipping-unit-plan.json --receipt shipping-unit-receipt.json --log shipping-unit.log
      - name: Native host library tests
        run: cargo test --locked --profile "$CI_PROFILE" -p kontra-native-host --lib
      - name: Native host lifecycle and software-GL presentation
        env:
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a cargo test --locked --profile "$CI_PROFILE" \
            -p kontra-native-host --lib -- --ignored --test-threads=1
          xvfb-run -a cargo test --locked --profile "$CI_PROFILE" \
            -p kontra-native-host --test x11_visibility -- --ignored --test-threads=1

      - name: Build VST3 for native editor validation
        run: |
          python3 - <<'PYPIN'
          import pathlib, re, tomllib
          revision = re.search(r'config.mui_revision = "([0-9a-f]{40})"', pathlib.Path('src/ui/mod.rs').read_text()).group(1)
          sources = {p['source'].split('#')[-1] for p in tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package'] if 'Matari-Audio/MUI' in p.get('source', '')}
          assert sources == {revision}, f'MUI reporting identity differs from compiled sources: {sources}'
          PYPIN
          cargo build --locked --profile "$CI_PROFILE" --lib
          mkdir -p ui-plugin/KONTRA.vst3/Contents/x86_64-linux
          cp "target/$CI_PROFILE/libkontakto.so" ui-plugin/KONTRA.vst3/Contents/x86_64-linux/KONTRA.so
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kontra-vst3-ui
          path: ui-plugin/
          retention-days: 7
          if-no-files-found: error

  layer-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: base+model
            crates: "-p kontra-time -p kontra-law -p kontra-macros -p kontra-params -p kontra-events -p kontra-ui-model -p kontra-protocol"
          - layer: dsp
            crates: "-p kontra-dsp-core -p kontra-dsp-filter -p kontra-dsp-eq -p kontra-dsp-dynamics -p kontra-dsp-delay -p kontra-dsp-reverb -p kontra-dsp-drive -p kontra-dsp-spatial -p kontra-dsp-modulators -p kontra-dsp"
          - layer: engine+script
            crates: "-p kontra-stream -p kontra-voice -p kontra-vm -p kontra-engine -p kontra-ksp -p kontra-lua"
          - layer: format
            crates: "-p kontra-format -p kontra-format-kontakt -p kontra-format-uvi -p kontra-format-sfz -p kontra-format-native"
          - layer: app
            crates: "-p kontra-library -p kontra-align -p kontra-ui -p kontra-host"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: layer-tests-${{ matrix.layer }}
      # Plain cargo: GitHub runners have no build-slot. Each layer tests only its own crates (09-BUILD.md §4).
      - name: Test ${{ matrix.layer }}
        run: cargo test --locked ${{ matrix.crates }}

  shipping-plan:
    needs: changes
    if: inputs.release_validation && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Nightly shipping identity
        if: inputs.release_validation || github.event_name == 'pull_request'
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/test_version.py
          python3 tools/version.py nightly --write
          test "$(python3 tools/version.py nightly-dirty)" = false
          echo "KONTRA_NIGHTLY_BUILD=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Inventory the exact shipping integration targets
        id: plan
        run: |
          cargo metadata --locked --no-deps --format-version 1 > shipping-metadata.json
          python3 .github/scripts/shipping_tests.py plan \
            --metadata shipping-metadata.json --crates "$CRATES" --source "$GITHUB_SHA" \
            --plan shipping-test-plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipping-test-plan-${{ github.sha }}
          path: shipping-test-plan.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  shipping-tests:
    needs: [changes, shipping-plan]
    if: inputs.release_validation && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shipping-plan.outputs.matrix) }}
    concurrency:
      group: ci-shipping-integration-${{ github.workflow }}-${{ github.sha }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Nightly shipping identity
        if: inputs.release_validation || github.event_name == 'pull_request'
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/test_version.py
          python3 tools/version.py nightly --write
          test "$(python3 tools/version.py nightly-dirty)" = false
          echo "KONTRA_NIGHTLY_BUILD=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: System libraries (X11, OpenGL/Vulkan, ALSA, JACK)
        run: |
          mkdir -p ui-plugin/editor-debs/partial
          sudo apt-get update
          # Retain the exact packages for offline editor setup on the same runner image.
          sudo apt-get -o Dir::Cache::archives="$PWD/ui-plugin/editor-debs" \
            -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends \
            dbus-x11 mesa-utils vulkan-tools ffmpeg unzip ripgrep libegl1 \
            libfreetype6 libfontconfig1 libxext6 libxrender1 libxinerama1 \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers xvfb xauth \
            libasound2-dev libjack-jackd2-dev
          # apt owns partial/; Cargo must be able to scan the workspace.
          sudo chmod -R a+rX ui-plugin/editor-debs
          (cd ui-plugin/editor-debs && sha256sum *.deb > SHA256SUMS)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shipping-test-plan-${{ github.sha }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-release-integration-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Execute and attest the assigned integration targets
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > shipping-metadata.json
          python3 .github/scripts/shipping_tests.py run \
            --metadata shipping-metadata.json --crates "$CRATES" --source "$GITHUB_SHA" \
            --plan shipping-test-plan.json --shard "$SHARD" --shard-id "$SHARD_ID" \
            --receipt "receipt-$SHARD.json" --log "shipping-test-$SHARD.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: shipping-test-receipt-${{ matrix.shard }}-${{ github.sha }}
          path: receipt-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shipping-test-log-${{ matrix.shard }}-${{ github.sha }}
          path: shipping-test-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  shipping-coverage:
    needs: [changes, shipping-plan, shipping-tests]
    if: ${{ always() && inputs.release_validation && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every shipping matrix job
        env:
          PLAN: ${{ needs.shipping-plan.result }}
          TESTS: ${{ needs.shipping-tests.result }}
        run: |
          test "$PLAN" = success
          test "$TESTS" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shipping-test-plan-${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shipping-test-receipt-*-${{ github.sha }}
          path: shipping-receipts
          merge-multiple: true
      - name: Require the exact integration executable union
        run: |
          python3 .github/scripts/shipping_tests.py aggregate --source "$GITHUB_SHA" \
            --plan shipping-test-plan.json --receipts shipping-receipts

  editor:
    needs: [changes, linux]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/plugin-ui.yml
    with:
      artifact-name: kontra-vst3-ui
      plugin-path: KONTRA.vst3
      require-mui-diagnostics: true

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    concurrency:
      group: ci-windows-${{ github.workflow }}-${{ inputs.release_validation && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Portable license bundle checks
        run: python3 tools/licenses.py --self-test
      - name: Nightly shipping identity
        if: inputs.release_validation || github.event_name == 'pull_request'
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/test_version.py
          python3 tools/version.py nightly --write
          python3 tools/version.py nightly-dirty
          echo "KONTRA_NIGHTLY_BUILD=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-${{ env.CI_PROFILE }}-standalone
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true
      - name: check
        shell: bash
        run: cargo check --locked --profile "$CI_PROFILE" --all-targets --features standalone
      - name: Native protected-format fixtures
        shell: bash
        run: |
          cargo test --locked --profile "$CI_PROFILE" -p sampler-uvi --lib bank::tests
          cargo test --locked --profile "$CI_PROFILE" -p sampler-kontakt --lib access::tests

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    concurrency:
      group: ci-macos-${{ github.workflow }}-${{ inputs.release_validation && github.sha || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Universal installer orchestration checks
        run: |
          python3 tools/licenses.py --self-test
          python3 .github/scripts/test_package_macos.py
          xcrun swiftc -typecheck .github/scripts/check_macos_bundles.swift
          xcrun swift .github/scripts/macos_package_preflight.swift
      - name: Nightly shipping identity
        if: inputs.release_validation || github.event_name == 'pull_request'
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 tools/test_version.py
          python3 tools/version.py nightly --write
          python3 tools/version.py nightly-dirty
          echo "KONTRA_NIGHTLY_BUILD=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ env.CI_PROFILE }}-standalone
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true
      - name: check
        shell: bash
        run: cargo check --locked --profile "$CI_PROFILE" --all-targets --features standalone

  required:
    name: CI required
    if: always()
    needs: [changes, linux, layer-tests, windows, macos, editor, shipping-plan, shipping-tests, shipping-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINUX: ${{ needs.linux.result }}
          LAYER_TESTS: ${{ needs.layer-tests.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          EDITOR: ${{ needs.editor.result }}
          RELEASE_VALIDATION: ${{ inputs.release_validation && 'true' || 'false' }}
          SHIPPING_PLAN: ${{ needs.shipping-plan.result }}
          SHIPPING_TESTS: ${{ needs.shipping-tests.result }}
          SHIPPING_COVERAGE: ${{ needs.shipping-coverage.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then
            test "$LINUX" = success
            test "$LAYER_TESTS" = success
            test "$WINDOWS" = success
            test "$MACOS" = success
            test "$EDITOR" = success
          else
            test "$CODE" = false
            test "$LINUX" = skipped
            test "$LAYER_TESTS" = skipped
            test "$WINDOWS" = skipped
            test "$MACOS" = skipped
            test "$EDITOR" = skipped
          fi
          if [ "$RELEASE_VALIDATION" = true ]; then
            test "$CODE" = true
            test "$SHIPPING_PLAN" = success
            test "$SHIPPING_TESTS" = success
            test "$SHIPPING_COVERAGE" = success
          else
            test "$RELEASE_VALIDATION" = false
            test "$SHIPPING_PLAN" = skipped
            test "$SHIPPING_TESTS" = skipped
            test "$SHIPPING_COVERAGE" = skipped
          fi
