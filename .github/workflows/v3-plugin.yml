name: v3 plugin

# The KONTRA v3 plugin (kontra-plugin, "KONTRA", audio.matari.kontra-v3)
# as CLAP and VST3 bundles: built on free runners, validated,
# uploaded as artifacts. Nothing is installed anywhere but the runner.

on:
  push:
    branches: [main, v3]
    paths:
      - 'plugin/**'
      - 'crates/**'
      - 'vendor/**'
      - 'moose.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/v3-plugin.yml'
  pull_request:
    branches: [main, v3]
    paths:
      - 'plugin/**'
      - 'moose.toml'
      - '.github/workflows/v3-plugin.yml'
  workflow_dispatch:

concurrency:
  group: v3-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target

jobs:
  bundle:
    if: '!github.event.repository.private'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    name: bundle (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: v3-plugin-${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install cargo-moose
        shell: bash
        run: |
          MOOSE_REV=$(python3 -c '
          import re, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          for pkg in lock.get("package", []):
              if pkg.get("name") == "moose":
                  m = re.search(r"#([0-9a-f]+)$", pkg.get("source", ""))
                  if m:
                      print(m.group(1))
                      break
          ')
          if [ -n "$MOOSE_REV" ]; then
            cargo install --locked --git https://github.com/Matari-Audio/moose --rev "$MOOSE_REV" cargo-moose
          else
            cargo install --locked --git https://github.com/Matari-Audio/moose cargo-moose
          fi
      - name: CLAP, VST3, and AU bundles
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo moose build --clap --vst3 --au2 -p kontra-plugin --target ${{ matrix.target }}
          else
            cargo moose build --clap --vst3 -p kontra-plugin --target ${{ matrix.target }}
          fi
          git diff --exit-code -- Cargo.lock
      - name: Verify bundles
        shell: bash
        run: |
          ls -la "target/bundles/${{ matrix.target }}"
          test -e "target/bundles/${{ matrix.target }}/KONTRA.clap"
          test -e "target/bundles/${{ matrix.target }}/KONTRA.vst3"
          if [ "$RUNNER_OS" = macOS ]; then
            test -e "target/bundles/${{ matrix.target }}/KONTRA.component"
          fi
      - name: clap-validator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
          clap-validator validate "target/bundles/${{ matrix.target }}/KONTRA.clap"
      - name: Plugin tests
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p kontra-plugin --lib v3_has_its_own_identity
          cargo test --locked -p kontra-plugin --lib input::tests
      # A tar keeps the bundles' executable bits; the artifact alone does not.
      - name: Archive bundles
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            tar -cf kontra-v3-bundles.tar -C "target/bundles/${{ matrix.target }}" "KONTRA.clap" "KONTRA.vst3" "KONTRA.component"
          else
            tar -cf kontra-v3-bundles.tar -C "target/bundles/${{ matrix.target }}" "KONTRA.clap" "KONTRA.vst3"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kontra-v3-${{ matrix.name }}
          path: kontra-v3-bundles.tar
          retention-days: 14
