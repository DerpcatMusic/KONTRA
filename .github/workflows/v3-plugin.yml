name: v3 plugin

# The KONTRA v3 plugin (kontra-plugin, "KONTRA v3", audio.matari.kontra-v3)
# as CLAP and VST3 bundles beside v2's: built on free runners, validated,
# uploaded as artifacts. Nothing is installed anywhere but the runner.

on:
  push:
    branches: [v3, main]
    paths:
      - 'plugin/**'
      - 'crates/**'
      - 'vendor/**'
      - 'moose.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/v3-plugin.yml'
  pull_request:
    branches: [v3, main]
    paths:
      - 'plugin/**'
      - 'moose.toml'
      - '.github/workflows/v3-plugin.yml'
  workflow_dispatch:

concurrency:
  group: v3-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  # The MOOSE revision Cargo.toml pins; cargo-moose must match it.
  MOOSE_REV: bffa4677d0b82119d38566ce7e932dc5c463d497

jobs:
  bundle:
    if: '!github.event.repository.private'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    name: bundle (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: v3-plugin-${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install cargo-moose
        shell: bash
        run: cargo install --locked --git https://github.com/Matari-Audio/moose --rev "$MOOSE_REV" cargo-moose
      - name: CLAP and VST3 bundles
        shell: bash
        run: cargo moose build --clap --vst3 -p kontra-plugin --target ${{ matrix.target }}
      - name: Bundles beside v2's
        shell: bash
        run: |
          ls -la "target/bundles/${{ matrix.target }}"
          test -e "target/bundles/${{ matrix.target }}/KONTRA v3.clap"
          test -e "target/bundles/${{ matrix.target }}/KONTRA v3.vst3"
      - name: clap-validator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag 0.4.1 clap-validator
          clap-validator validate "target/bundles/${{ matrix.target }}/KONTRA v3.clap"
      - name: Plugin tests
        if: runner.os == 'Linux'
        run: cargo test --locked -p kontra-plugin --lib -- v3_has_its_own_identity input::tests
      # A tar keeps the bundles' executable bits; the artifact alone does not.
      - name: Archive bundles
        shell: bash
        run: tar -cf kontra-v3-bundles.tar -C "target/bundles/${{ matrix.target }}" "KONTRA v3.clap" "KONTRA v3.vst3"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kontra-v3-${{ matrix.name }}
          path: kontra-v3-bundles.tar
          retention-days: 14
