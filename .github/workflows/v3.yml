name: v3 plan

# Enforces docs/architecture-v3/12-WORKFLOW.md on the v3 integration branch:
# the manifest is valid, each PR stays inside its task's owned paths, merged
# task PRs close their issue (closing keywords only work on the default
# branch), and v3 itself gets full CI after every merge.
on:
  pull_request:
    branches: [v3, main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, closed]
  push:
    branches: [v3, main]

permissions:
  contents: read

concurrency:
  group: v3-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  release-notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py'

  plan:
    name: v3 plan
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: v3-plan-xtask
      - name: Manifest
        run: |
          python3 tools/plan/plan.py validate
          python3 tools/plan/plan.py index --check
          python3 -m unittest tools/plan/test_plan.py
      - name: Scope
        if: github.base_ref != 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'scope-override') }}
        run: |
          task=$(python3 tools/plan/plan.py task-of "$HEAD_REF" || true)
          if [ -z "$task" ]; then
            echo "::error::Branch '$HEAD_REF' is not v3-<task id>-<slug>, v3-plan-<slug> or v3-sync-main-<date>. See docs/architecture-v3/12-WORKFLOW.md §3."
            exit 1
          fi
          if [ "$OVERRIDE" = "true" ]; then
            python3 tools/plan/plan.py scope "$task" --base "origin/$BASE_REF" || echo "::warning::scope-override label set; outside-scope files allowed"
          else
            python3 tools/plan/plan.py scope "$task" --base "origin/$BASE_REF"
          fi
      - name: Debt and size ratchets
        env:
          # The size-growth label lets a PR grow a crate's production lines; it must also run `xtask size --update`.
          KONTRA_ALLOW_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'size-growth') && '1' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Any task may commit the baseline. Without the label no count may rise above the
          # base's; `size --check` then measures against the committed (equal or lower) baseline,
          # so a count lowered below the real figure fails too.
          if [ "$KONTRA_ALLOW_GROWTH" != 1 ]; then
            git show "origin/$BASE_REF:tools/xtask/size-baseline.json" > "$RUNNER_TEMP/base-size.json"
            python3 - "$RUNNER_TEMP/base-size.json" tools/xtask/size-baseline.json <<'PY'
          import json, sys
          base, mine = (json.load(open(p)) for p in sys.argv[1:])
          raised = sorted(k for k, v in mine.items() if v > base.get(k, 0))
          if raised:
              sys.exit(f"::error::size baseline raised without the size-growth label: {', '.join(raised)}")
          PY
          fi
          cargo run -p xtask -- debt --check
          cargo run -p xtask -- size --check

  merged:
    name: close task issue
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.base_ref != 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 tools/plan/plan.py on-merge "$HEAD_REF" --pr "$PR"

  ci:
    name: v3 CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      release_validation: false
