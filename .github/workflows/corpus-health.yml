name: Corpus health

# Quick-tier corpus-health over the small bundled Kontakt fixture set (quick-fixtures.txt).
# Fails when the run has an error that is not in the committed baseline.
# The full installed-library corpus is never run here: it needs local libraries.

on:
  pull_request:
    paths:
      - "tools/corpus-health/**"
      - "crates/sampler-kontakt/tests/fixtures/**"
      - "tools/kontakt-reference/scenarios/**"
      - "crates/sampler-kontakt/**"
      - "crates/sampler-uvi/**"
      - "crates/sampler-ksp/**"
      - ".github/workflows/corpus-health.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  MUI_REPORTING_DISABLED: "1"

jobs:
  quick:
    name: corpus-health quick (fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcursor-dev libxkbcommon-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libfreetype-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Build corpus-health
        run: cargo build --locked -p corpus-health
      - name: Quick tier over fixtures
        env:
          CH_QUICK_FILE: tools/corpus-health/quick-fixtures.txt
        run: |
          target/debug/corpus-health run "$RUNNER_TEMP/corpus.jsonl" --tier quick \
            crates/sampler-kontakt/tests/fixtures tools/kontakt-reference/scenarios
      - name: Diagnostics: fail on new errors
        run: |
          target/debug/corpus-health health "$RUNNER_TEMP/corpus.jsonl" \
            --json "$RUNNER_TEMP/diagnostics.json" \
            --baseline tools/corpus-health/baseline-fixtures.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-health-diagnostics
          path: ${{ runner.temp }}/diagnostics.json
          if-no-files-found: ignore
