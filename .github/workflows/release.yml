name: Release

# A release twice a day (06:00 and 18:00 UTC) when pull requests merged since
# the last one, and on demand (Actions > Release > Run workflow). Each release gets the next version
# (tools/version.py), notes written from its pull requests
# (tools/release/notes.py), the whole history as CHANGELOG.md
# (tools/release/changelog.py) and stays published. Downloads use stable
# names, so releases/latest/download/<name> always works.
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'v3-release' || format('v3-release-{0}', github.run_id) }}
  cancel-in-progress: false  # the running release finishes; only the newest waiting one runs next

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    if: '!github.event.repository.private'
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          git tag --points-at HEAD > head-tags.txt
          # A scheduled run releases only when something merged since the last release.
          pending=$(python3 tools/version.py pending)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$pending" -lt 1 ]; then
            echo "nothing merged since $(python3 tools/version.py previous)"
            echo 'released=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/release/already_released.py

  verify:
    needs: check
    if: needs.check.outputs.released == 'false'
    uses: ./.github/workflows/v3-verify.yml

  bundle:
    needs: [check, licenses]
    if: needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, name: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev libwayland-dev \
            libasound2-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: v3-plugin-${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install cargo-moose from the locked Moose revision
        shell: bash
        run: |
          set -euo pipefail
          MOOSE_REV=$(python3 .github/scripts/locked_moose_revision.py Cargo.lock)
          cargo metadata --locked --format-version 1 --filter-platform ${{ matrix.target }} >/dev/null
          cargo install --locked --git https://github.com/Matari-Audio/moose --rev "$MOOSE_REV" cargo-moose
      - name: CLAP, VST3, and AU bundles
        shell: bash
        run: |
          set -euo pipefail
          # About shows the release's version.
          KONTRA_VERSION=$(python3 tools/version.py next)
          export KONTRA_VERSION
          if [ "$RUNNER_OS" = macOS ]; then
            cargo moose build --clap --vst3 --au2 -p kontra-plugin --target ${{ matrix.target }}
          else
            cargo moose build --clap --vst3 -p kontra-plugin --target ${{ matrix.target }}
          fi
          # KONTRA as an app of its own, beside the Linux and Windows bundles.
          if [ "$RUNNER_OS" != macOS ]; then
            cargo build --release --locked -p kontra-plugin --features standalone --bin kontra-standalone --target ${{ matrix.target }}
            exe=kontra-standalone; [ "$RUNNER_OS" = Windows ] && exe=kontra-standalone.exe
            cp "target/${{ matrix.target }}/release/$exe" "target/bundles/${{ matrix.target }}/"
          fi
          git diff --exit-code -- Cargo.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os != 'macOS'
        with:
          name: release-legal
          path: legal
      - name: Stage and archive bundles
        shell: bash
        run: |
          set -euo pipefail
          stage="KONTRA-${{ matrix.name }}"
          bundles="target/bundles/${{ matrix.target }}"
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir "$stage"
            cp -R "$bundles/KONTRA.clap" "$bundles/KONTRA.vst3" "$bundles/KONTRA.component" "$stage/"
            printf '%s\n' "$GITHUB_SHA" > "$stage/SOURCE_COMMIT.txt"
            ditto -c -k --keepParent "$stage" "$stage.zip"
          else
            python3 .github/scripts/stage_nightly.py --platform "${{ matrix.name }}" --stage "$stage" --bundles "$bundles"
            cp legal/LICENSES.txt "$stage/LICENSES.txt"
            if [ "$RUNNER_OS" = Windows ]; then
              (cd "$stage" && 7z a -tzip "../$stage.zip" *)
            else
              (cd "$stage" && zip -qry "../$stage.zip" .)
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os == 'macOS' && 'macos-input' || 'release' }}-${{ matrix.name }}
          path: KONTRA-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 1

  licenses:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
      - name: Licenses and MPL covered source
        run: |
          set -euo pipefail
          cargo install cargo-about --version 0.9.2 --features cli --locked
          lic="$RUNNER_TEMP/licenses"
          python3 tools/licenses.py --output "$lic"
          {
            echo "KONTRA redistribution notices and license texts."
            echo "MPL covered source: KONTRA-covered-source.zip on the same release."
            for f in LICENSE NOTICE THIRD_PARTY.md "$lic/THIRD_PARTY_NOTICES.txt"; do
              printf '\n===== %s =====\n' "$f"; cat "$f"
            done
            find "$lic" -type f ! -path "$lic/sources/*" ! -name THIRD_PARTY_NOTICES.txt | sort | while read -r f; do
              printf '\n===== licenses/%s =====\n' "${f#"$lic"/}"; cat "$f"
            done
          } > LICENSES.txt
          (cd "$lic" && zip -qr "$GITHUB_WORKSPACE/KONTRA-covered-source.zip" sources)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-legal
          path: |
            LICENSES.txt
            KONTRA-covered-source.zip
          if-no-files-found: error
          retention-days: 1

  macos-universal:
    needs: [bundle, licenses]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-input-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-legal
          path: legal
      - name: Compose, sign and notarize universal installer
        env:
          APPLE_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_APPLICATION_CERTIFICATE_P12_BASE64 APPLE_INSTALLER_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_ID_APPLICATION APPLE_DEVELOPER_ID_INSTALLER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          for arch in arm64 x86_64; do ditto -x -k "dist/KONTRA-macos-$arch.zip" inputs; done
          version=$(python3 tools/version.py next)
          python3 .github/scripts/package_macos.py --arm64 inputs/KONTRA-macos-arm64 \
            --x86-64 inputs/KONTRA-macos-x86_64 --stage universal-stage --revision "$GITHUB_SHA" --version "$version"
          mkdir -p "universal-stage/payload/Library/Application Support/KONTRA"
          cp legal/LICENSES.txt "universal-stage/payload/Library/Application Support/KONTRA/LICENSES.txt"
          source .github/scripts/macos_signing_keychain.sh
          bash .github/scripts/package_macos.sh universal-stage KONTRA-macos-universal.pkg
      - name: Preserve signed macOS ZIP download
        run: |
          set -euo pipefail
          mkdir compatibility
          ditto 'universal-stage/payload/Library/Audio/Plug-Ins/CLAP/KONTRA.clap' compatibility/KONTRA.clap
          ditto 'universal-stage/payload/Library/Audio/Plug-Ins/VST3/KONTRA.vst3' compatibility/KONTRA.vst3
          ditto 'universal-stage/payload/Library/Audio/Plug-Ins/Components/KONTRA.component' compatibility/KONTRA.component
          cp legal/LICENSES.txt compatibility/LICENSES.txt
          printf '%s\n' 'KONTRA universal plug-ins (CLAP, VST3, AU). The signed PKG installer is recommended; otherwise copy these bundles to your plug-in folders and rescan your DAW.' > compatibility/README.txt
          ditto -c -k --sequesterRsrc compatibility KONTRA-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: |
            KONTRA-macos-universal.pkg
            KONTRA-macos-universal.notarization.json
            KONTRA-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1

  # Pin artifact IDs before any native probe. The separate runners below can
  # change their local copies, but publication downloads these immutable IDs.
  freeze-release:
    needs: [bundle, macos-universal, licenses]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      linux: ${{ steps.artifacts.outputs.linux }}
      windows: ${{ steps.artifacts.outputs.windows }}
      macos: ${{ steps.artifacts.outputs.macos }}
      legal: ${{ steps.artifacts.outputs.legal }}
    steps:
      - id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts.json
          for target in linux:linux-x86_64 windows:windows-x86_64 macos:macos-universal legal:legal; do
            key=${target%%:*}
            name="release-${target#*:}"
            id=$(jq -er --arg name "$name" '
              [.[].artifacts[] | select(.name == $name and (.expired | not)) | .id]
              | if length == 1 then .[0] else error("Expected one live artifact: " + $name) end
            ' artifacts.json)
            echo "$key=$id" >> "$GITHUB_OUTPUT"
          done

  validate-pc:
    needs: freeze-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux}
          - {os: windows-2025, platform: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.freeze-release.outputs[matrix.platform] || 'missing' }}
      - name: Verify Linux plugin loads
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils unzip libx11-xcb1 libxcb-icccm4 libxcursor1 libxkbcommon-x11-0 \
            libxrandr2 libgl1 libvulkan1 libwayland-client0 libasound2 libjack-jackd2-0
          stage="$RUNNER_TEMP/kontra-linux-check"
          unzip -q KONTRA-linux-x86_64.zip -d "$stage"
          python3 .github/scripts/check_glibc.py "$stage/KONTRA.clap" "$stage/KONTRA.vst3/Contents/x86_64-linux/KONTRA.so"
          python3 .github/scripts/check_plugin_load.py --platform linux-x86_64 --bundles "$stage"
      - name: Verify Windows installation and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kontra-install-test'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'KONTRA-windows-x86_64'
          Expand-Archive -LiteralPath 'KONTRA-windows-x86_64.zip' -DestinationPath $stage
          & (Join-Path $stage 'install.ps1')
          $common = Join-Path $env:LOCALAPPDATA 'Programs\Common'
          $incomplete = Join-Path $env:RUNNER_TEMP 'kontra-incomplete-package'
          New-Item -ItemType Directory -Path (Join-Path $incomplete 'KONTRA.vst3') -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $stage 'install.ps1'), (Join-Path $stage 'KONTRA.clap') -Destination $incomplete
          $rejected = $false
          try { & (Join-Path $incomplete 'install.ps1') }
          catch {
            if ($_.Exception.Message -notlike 'Missing package file:*') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'Installer accepted a VST3 bundle without its binary' }
          python3 .github/scripts/check_plugin_load.py --platform windows-x86_64 --bundles $common --installed
          & (Join-Path $stage 'uninstall.ps1')
          foreach ($plugin in @('CLAP\KONTRA.clap', 'VST3\KONTRA.vst3')) {
            if (Test-Path (Join-Path $common $plugin)) { throw "Uninstall left $plugin" }
          }

  validate-macos:
    needs: freeze-release
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.freeze-release.outputs.macos || 'missing' }}
      - name: Verify installed universal plugins
        run: |
          set -euo pipefail
          sudo installer -pkg KONTRA-macos-universal.pkg -target /
          for bundle in /Library/Audio/Plug-Ins/CLAP/KONTRA.clap /Library/Audio/Plug-Ins/VST3/KONTRA.vst3 /Library/Audio/Plug-Ins/Components/KONTRA.component; do
            lipo "$bundle/Contents/MacOS/KONTRA" -verify_arch arm64 x86_64
            codesign --verify --deep --strict --all-architectures "$bundle"
          done
          test -s '/Library/Application Support/KONTRA/LICENSES.txt'
      - name: Validate installed AUv2
        timeout-minutes: 5
        run: |
          set -euo pipefail
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Knt3 Mtri | tee "$RUNNER_TEMP/kontra-auval.txt"
          grep -q 'VALIDATION SUCCEEDED' "$RUNNER_TEMP/kontra-auval.txt"

  publish:
    needs: [verify, freeze-release, validate-pc, validate-macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ format('{0},{1},{2},{3}', needs.freeze-release.outputs.linux, needs.freeze-release.outputs.windows, needs.freeze-release.outputs.macos, needs.freeze-release.outputs.legal) }}
          path: ${{ runner.temp }}/kontra-release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in $(git tag --points-at HEAD --list 'v0.*'); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Already released as $tag"
              exit 0
            fi
          done
          version=$(python3 tools/version.py next)
          python3 tools/release/notes.py --version "$version" > notes.md
          python3 tools/release/changelog.py > CHANGELOG.md
          assets=(KONTRA-linux-x86_64.zip KONTRA-windows-x86_64.zip KONTRA-macos-arm64.zip
                  KONTRA-macos-universal.pkg KONTRA-macos-universal.notarization.json
                  KONTRA-covered-source.zip)
          for i in "${!assets[@]}"; do
            assets[i]="$RUNNER_TEMP/kontra-release/${assets[i]}"
            if [[ ! -s "${assets[i]}" ]]; then
              echo "Missing release asset: ${assets[i]}" >&2
              exit 1
            fi
          done
          gh release create "v$version" --target "$GITHUB_SHA" --latest --title "KONTRA $version" --notes-file notes.md CHANGELOG.md "${assets[@]}"
