name: Release

# Every change to main publishes the newest build as the Latest release; older
# nightly releases are removed (their tags stay, so notes still diff from them).
# Downloads use stable names, so releases/latest/download/<name> always works.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'v3-release' || format('v3-release-{0}', github.run_id) }}
  cancel-in-progress: false  # the running release finishes; only the newest waiting one runs next

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  MOOSE_REV: bffa4677d0b82119d38566ce7e932dc5c463d497

jobs:
  check:
    if: '!github.event.repository.private'
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          git tag --points-at HEAD > head-tags.txt
          python3 tools/release/already_released.py

  verify:
    needs: check
    if: needs.check.outputs.released == 'false'
    uses: ./.github/workflows/v3-verify.yml

  bundle:
    needs: [check, licenses]
    if: needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, name: windows-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, name: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: v3-plugin-${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install cargo-moose
        shell: bash
        run: cargo install --locked --git https://github.com/Matari-Audio/moose --rev "$MOOSE_REV" cargo-moose
      - name: CLAP and VST3 bundles
        shell: bash
        run: cargo moose build --clap --vst3 -p kontra-plugin --target ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os != 'macOS'
        with:
          name: release-legal
          path: legal
      - name: Stage and archive bundles
        shell: bash
        run: |
          set -euo pipefail
          stage="KONTRA-nightly-${{ matrix.name }}"
          bundles="target/bundles/${{ matrix.target }}"
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir "$stage"
            cp -R "$bundles/KONTRA.clap" "$bundles/KONTRA.vst3" "$stage/"
            printf '%s\n' "$GITHUB_SHA" > "$stage/SOURCE_COMMIT.txt"
            ditto -c -k --keepParent "$stage" "$stage.zip"
          else
            python3 .github/scripts/stage_nightly.py --platform "${{ matrix.name }}" --stage "$stage" --bundles "$bundles"
            cp legal/LICENSES.txt "$stage/LICENSES.txt"
            if [ "$RUNNER_OS" = Linux ]; then
              python3 .github/scripts/check_glibc.py "$stage/KONTRA.clap" "$stage/KONTRA.vst3/Contents/x86_64-linux/KONTRA.so"
            fi
            if [ "$RUNNER_OS" = Windows ]; then
              (cd "$stage" && 7z a -tzip "../$stage.zip" *)
            else
              (cd "$stage" && zip -qry "../$stage.zip" .)
            fi
          fi
      - name: Verify Windows installation and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kontra-install-test'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'KONTRA-nightly-windows-x86_64'
          & (Join-Path $stage 'install.ps1')
          $plugins = @('CLAP\KONTRA.clap', 'VST3\KONTRA.vst3')
          foreach ($plugin in $plugins) {
            if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\Common\$plugin"))) { throw "Installation missing $plugin" }
          }
          & (Join-Path $stage 'uninstall.ps1')
          foreach ($plugin in $plugins) {
            if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\Common\$plugin")) { throw "Uninstall left $plugin" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os == 'macOS' && 'macos-input' || 'release' }}-${{ matrix.name }}
          path: KONTRA-nightly-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 1

  licenses:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
      - name: Licenses and MPL covered source
        run: |
          set -euo pipefail
          cargo install cargo-about --version 0.9.2 --features cli --locked
          lic="$RUNNER_TEMP/licenses"
          python3 tools/licenses.py --output "$lic"
          {
            echo "KONTRA redistribution notices and license texts."
            echo "MPL covered source: KONTRA-nightly-covered-source.zip on the same release."
            for f in LICENSE NOTICE THIRD_PARTY.md "$lic/THIRD_PARTY_NOTICES.txt"; do
              printf '\n===== %s =====\n' "$f"; cat "$f"
            done
            find "$lic" -type f ! -path "$lic/sources/*" ! -name THIRD_PARTY_NOTICES.txt | sort | while read -r f; do
              printf '\n===== licenses/%s =====\n' "${f#"$lic"/}"; cat "$f"
            done
          } > LICENSES.txt
          (cd "$lic" && zip -qr "$GITHUB_WORKSPACE/KONTRA-nightly-covered-source.zip" sources)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-legal
          path: |
            LICENSES.txt
            KONTRA-nightly-covered-source.zip
          if-no-files-found: error
          retention-days: 1

  macos-universal:
    needs: [bundle, licenses]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-input-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-legal
          path: legal
      - name: Compose, sign and notarize universal installer
        env:
          APPLE_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_APPLICATION_CERTIFICATE_P12_BASE64 APPLE_INSTALLER_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_ID_APPLICATION APPLE_DEVELOPER_ID_INSTALLER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          for arch in arm64 x86_64; do ditto -x -k "dist/KONTRA-nightly-macos-$arch.zip" inputs; done
          version=$(python3 tools/version.py v3-nightly)
          python3 .github/scripts/package_macos.py --arm64 inputs/KONTRA-nightly-macos-arm64 \
            --x86-64 inputs/KONTRA-nightly-macos-x86_64 --stage universal-stage --revision "$GITHUB_SHA" --version "$version"
          mkdir -p "universal-stage/payload/Library/Application Support/KONTRA"
          cp legal/LICENSES.txt "universal-stage/payload/Library/Application Support/KONTRA/LICENSES.txt"
          source .github/scripts/macos_signing_keychain.sh
          bash .github/scripts/package_macos.sh universal-stage KONTRA-nightly-macos-universal.pkg
      - name: Preserve signed macOS ZIP download
        run: |
          set -euo pipefail
          mkdir compatibility
          ditto 'universal-stage/payload/Library/Audio/Plug-Ins/CLAP/KONTRA.clap' compatibility/KONTRA.clap
          ditto 'universal-stage/payload/Library/Audio/Plug-Ins/VST3/KONTRA.vst3' compatibility/KONTRA.vst3
          cp legal/LICENSES.txt compatibility/LICENSES.txt
          printf '%s\n' 'KONTRA universal plug-ins. The signed PKG installer is recommended; otherwise copy these bundles to your plug-in folders and rescan your DAW.' > compatibility/README.txt
          ditto -c -k --sequesterRsrc compatibility KONTRA-nightly-macos-arm64.zip
      - name: Verify installed universal plugins
        run: |
          set -euo pipefail
          sudo installer -pkg KONTRA-nightly-macos-universal.pkg -target /
          for bundle in /Library/Audio/Plug-Ins/CLAP/KONTRA.clap /Library/Audio/Plug-Ins/VST3/KONTRA.vst3; do
            lipo "$bundle/Contents/MacOS/KONTRA" -verify_arch arm64 x86_64
            codesign --verify --deep --strict --all-architectures "$bundle"
          done
          test -s '/Library/Application Support/KONTRA/LICENSES.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: |
            KONTRA-nightly-macos-universal.pkg
            KONTRA-nightly-macos-universal.notarization.json
            KONTRA-nightly-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, bundle, macos-universal]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in $(git tag --points-at HEAD --list 'v3.*'); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Already released as $tag"
              exit 0
            fi
          done
          version=$(python3 tools/version.py v3-nightly)
          python3 tools/release/notes.py > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --latest --title "KONTRA $version" --notes-file notes.md KONTRA-nightly-*.zip KONTRA-nightly-macos-universal.pkg KONTRA-nightly-macos-universal.notarization.json
          # Only the newest nightly stays published; the tags keep the history.
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^v3\.0\.0-nightly\.' | grep -vxF "v$version" \
            | xargs -r -n1 gh release delete --yes
