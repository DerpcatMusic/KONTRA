[vendor]
name = "Matari Audio"
id = "audio.matari"
url = "https://github.com/Matari-Audio"
au_manufacturer = "Mtri"

[[plugin]]
# Bundles are KONTRA2.clap/.vst3 so v1 (KONTRA) installs alongside;
# hosts show "KONTRA 2".
name = "KONTRA2"
clap_name = "KONTRA 2"
vst3_name = "KONTRA 2"
au_name = "KONTRA 2"
bundle_id = "kontra2"
crate = "kontakto"
category = "instrument"
fourcc = "Knt2"
vst3_subcategory = "Sampler"

midi_input = true
midi_output = true
midi_input_ports = 4
midi_output_ports = 1
# Per-note events: CLAP note expressions reach each key (MPE).
midi2_input = true
