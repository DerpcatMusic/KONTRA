steps = [
  "Fill in the `tools/xtask` stub (binary crate `xtask`, already a workspace member; std + `cargo_metadata` + `serde_json` + `toml` only). Add `[alias] xtask = \"run -p xtask --\"` in a new `.cargo/config.toml` (keep `fast-linux.toml` separate).",
  "`xtask size`: production vs test lines per workspace crate, using the 00-BASELINE.md rule (test = `*test*.rs`, `tests/`, trailing `#[cfg(test)] mod` blocks). Print a markdown table. `--max-crate 8000 --max-file 800` flags fail when exceeded; an allow-list file `tools/xtask/size-allow.txt` lists today's offenders so it passes on v3 now.",
  "`xtask debt`: counts of `#[path]`, `#[allow(`, `Processor::`, `impl Default for`, `#[cfg(test)]` inside fn bodies (approximate: lines between `fn` and its closing brace), `Mutex` in RT crates (crates/engine, crates/dsp, sampler-core). `--baseline tools/xtask/debt-baseline.json` fails if any count grows; `--write-baseline` updates it.",
  "`xtask deps-check`: read `cargo metadata`; fail on any workspace→workspace edge not in `tools/xtask/dag.toml`. Seed dag.toml with today's edges (so it passes now) plus a `[forbidden]` table: no GPU crates (`wgpu*`, `naga`, `ash`, `x11rb`, `zbus`) reachable from `crates/{base,model,dsp,engine,script,format}/**` packages.",
