deps = ["P0.3"]
owns = ["crates/sampler-kontakt/src/stream_initial_hints.rs", "crates/sampler-kontakt/src/stream_initial_hints_tests.rs", "crates/sampler-kontakt/src/stream_hint_tests.rs", "crates/sampler-core/src/head_ranges.rs", "crates/sampler-ksp/src/sema.rs", "crates/sampler-ksp/src/hir.rs"]
docs = ["05-STREAM.md#1-the-preload-law", "../audit-2026-10-24/PLAYBACK_AUDIT.md"]
goal = "At load, compute for every zone the full range of sample-start offsets it can be played from, so the preload can cover it."
steps = [
  "Read how start hints are computed today: `stream_initial_hints.rs` and where `bounded_attack_anchors` consumes them (crates/sampler-kontakt/src/stream.rs; read only, owned by P1.2).",
  "Range sources: zone S.Mod / sample-start modulation depth; every KSP `play_note(..., offset, ...)` and `$EVENT_PAR_PLAY_POS`/`set_event_par(...PLAY_POS...)` whose offset sema can bound (constant, or a variable whose assigned values are bounded constants / a declared knob range); every modulation route whose target is sample start (CC, RTC, KeyPosition).",
  "Output: `StartRange { max_frames: Frames, unbounded: bool, sources: SmallVec<StartSource> }` per zone, carried on the existing hint structure.",
  "Unbounded ranges produce a load diagnostic naming the script line or route.",
  "Tests: the `cc_start` and `key_position` probe fixtures produce the expected ranges; an unbounded `play_note` offset produces `unbounded = true` and a diagnostic."
]
gate = ["build-slot cargo test -p sampler-kontakt stream_initial_hints", "build-slot cargo test -p sampler-ksp sema"]
done = ["Areia Spiccato Fast and Vista report non-zero start ranges (coordinator confirms on real libraries)."]

[[task]]
id = "P1.2"
title = "Preload law: base + full start range, never shrink below the law"
phase = 1
lane = "playback"
size = "L"
agent = "worker"
deps = ["P1.1"]
owns = ["crates/sampler-kontakt/src/stream.rs", "crates/sampler-kontakt/src/head_prepare.rs", "crates/sampler-kontakt/src/head_cache.rs", "crates/sampler-core/src/head_budget.rs", "crates/sampler-core/src/prepare.rs", "crates/sampler-core/src/prepare/**", "crates/sampler-core/tests/stream_start_runway.rs"]
docs = ["05-STREAM.md#1-the-preload-law"]
goal = "Head length = base (60 KB-equivalent per channel, Kontakt DFD default) + the zone's start range from P1.1, instead of measured warm-cache latency; over budget never truncates silently."
steps = [
  "Replace the head-size computation (`fn head_frames` in sampler-kontakt/src/stream.rs and sampler-core/src/prepare.rs: p95 latency + 10 ms slack) with `PreloadLaw { base, min, max }` applied per zone: frames = base + start_range.max_frames; unbounded → whole sample.",
  "Remove the budget binary search with `include_offsets = false` in `bounded_attack_anchors`. Over budget: load continues, every zone keeps its law-sized head, and the load report lists the budget excess with the largest contributors. (Purge selection is a later UX task.)",
  "Replace the ×16 `max_step` scaling with the zone's real maximum pitch step from its mapping/tune range.",
  "Keep heads in their current storage format in this task (format change is P6.1d)."
]
gate = ["build-slot cargo test -p sampler-kontakt stream", "build-slot cargo test -p sampler-core --lib prepare", "build-slot cargo test -p kontra-probe cc_start"]
done = ["Probe C9 passes on `cc_start` and `key_position` fixtures.", "Coordinator: Areia head frames reported ≥ base + CC113 range."]

