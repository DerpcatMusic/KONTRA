# KONTRA v3 task manifest: the single source of truth for v3 work.
#
# Every v3 issue on GitHub is generated from this file by `tools/plan/plan.py sync`.
# Edit here, never on GitHub; the next sync overwrites issue bodies.
# Format and rules: docs/architecture-v3/12-WORKFLOW.md.
#
# Task fields
#   id      "P<phase>.<n>[letter]"; the branch is v3-<id>-<slug>, the PR title starts with "<id>:"
#   deps    task ids that must be merged into v3 first
#   owns    path globs this task may change (relative to repo root). "@lock" pulls in a lock group.
#           Two open tasks never own overlapping paths (plan.py ready / scope enforce it).
#   agent   worker      : self-contained, an agent can do it from the brief alone
#           coordinator : merges, measurement, real-library runs, repo settings
#           spike       : research with a written verdict, small code allowed
#   draft   true = owns/steps are a forecast; the coordinator re-checks them against the tree
#           (and clears draft) before the task is dispatched
#   gate    commands that must pass; paste their output in the PR
#   done    acceptance criteria, checked in review

[meta]
branch = "v3"
branch_prefix = "v3-"
docs = "docs/architecture-v3"
project = "KONTRA v3"

[phases]
0 = "Guard rails"
1 = "On-time start"
2 = "Scripts never stall notes"
3 = "One script path without transport holds"
4 = "Base and model crates"
5 = "DSP families"
6 = "Engine crates"
7 = "Script and format crates"
8 = "App and plugin"

# Shared hot files. mode: exclusive = one open task at a time;
# append = several tasks may each add lines (conflicts resolve by keeping both);
# regenerate = never hand-merged, regenerated after rebase (see 12-WORKFLOW.md §6).
[locks.manifests]
mode = "exclusive"
paths = ["Cargo.toml", ".cargo/**", "rust-toolchain.toml"]
[locks.lockfile]
mode = "regenerate"
paths = ["Cargo.lock"]
[locks.ci]
mode = "exclusive"
paths = [".github/workflows/**", ".github/scripts/**"]
[locks.v2rs]
mode = "exclusive"
paths = ["src/sound/v2.rs", "src/sound/v2/**"]
[locks.plugin]
mode = "exclusive"
paths = ["src/plugin.rs", "src/plugin/**", "src/lib.rs"]
[locks.corelib]
mode = "exclusive"
paths = ["crates/sampler-core/src/lib.rs", "crates/sampler-core/Cargo.toml"]
[locks.registry]
mode = "append"
paths = ["crates/dsp/registry/src/lib.rs", "crates/dsp/registry/Cargo.toml"]
[locks.plan]
mode = "exclusive"
paths = ["docs/architecture-v3/tasks.toml", "docs/architecture-v3/TASKS.md"]

