  "`xtask debt --check`: compare against committed `tools/xtask/debt-baseline.toml`; fail if any counter grew, print the counters that shrank and tell the author to run `cargo xtask debt --update` so the ratchet tightens. Same for `xtask size --check` on production lines per crate group (growth allowed only with a `size-growth` PR label, read from env `KONTRA_ALLOW_GROWTH=1`).",
