[package]
name = "kontra-plugin"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
description = "KONTRA v3: the plugin shell over kontra-host and kontra-ui (CLAP, VST3)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]

[dependencies]
kontra-host = { path = "../crates/app/host" }
kontra-protocol = { path = "../crates/model/protocol" }
kontra-ui = { path = "../crates/app/ui" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", default-features = false, features = ["mui"] }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
clap-sys = { version = "0.5", optional = true }

[dev-dependencies]
moose-test = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497" }
