[package]
name = "kontra-plugin"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
description = "KONTRA v3: the plugin shell over kontra-host and kontra-ui (CLAP, VST3)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]

[dependencies]
kontra-align = { path = "../crates/app/align" }
kontra-host = { path = "../crates/app/host", features = ["align"] }
kontra-protocol = { path = "../crates/model/protocol" }
kontra-ui = { path = "../crates/app/ui" }
kontra-ui-model = { path = "../crates/model/ui-model" }
dirs = "5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
kontra-library = { path = "../crates/app/library" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", default-features = false, features = ["mui"] }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", features = ["mpe-input"], optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
clap-sys = { version = "0.5", optional = true }

[dev-dependencies]
moose-test = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497" }
