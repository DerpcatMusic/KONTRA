[package]
name = "kontra-window"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "The plugin's real editor in a real window, standalone: the gate for pointer input (07-APP.md §5.3)"

[lints]
workspace = true

[dependencies]
kontra-plugin = { path = "../../plugin", default-features = false }
kontra-host = { path = "../../crates/app/host" }
moose = { workspace = true, features = ["mui"] }
moose-standalone = { workspace = true, features = ["gui"] }
