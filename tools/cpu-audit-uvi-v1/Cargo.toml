[package]
name = "cpu-audit-uvi-v1"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
kontakto = { path = "../..", default-features = false, features = ["library-access", "uvi"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.5"
sha2 = "0.10.9"
dirs = "5"
libc = "0.2"
[profile.release]
lto = "thin"
strip = "none"
