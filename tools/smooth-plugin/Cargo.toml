[package]
name = "smooth-plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "SMOOTH: a spectrally selective dynamics editor"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]

[dependencies]
smooth-ui = { path = "../smooth-ui" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", default-features = false, features = ["mui"] }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { path = "../../vendor/mui" }
smooth-core = { path = "../smooth-core" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
