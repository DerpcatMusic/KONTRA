[package]
name = "luau-alloc"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

# Standalone spike: not a member of the root workspace.
[workspace]

[dependencies]
mlua = { version = "=0.12.2", features = ["luau"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# BEGIN tools/patches.py --manifests: blaze reads only manifest [patch] tables
[patch."https://github.com/Matari-Audio/MUI"]
moose-baseview = { path = "../../../../../frameworks/mui/vendor/moose-baseview" }
