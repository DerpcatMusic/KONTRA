[package]
name = "luau-gc"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

# Standalone spike: not a member of the root workspace.
[workspace]

[dependencies]
libc = "0.2"
mlua = { version = "=0.12.2", features = ["luau"] }
# Real UVI bank reader and the sampler's own script host.
sampler-uvi = { path = "../../../crates/sampler-uvi" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
