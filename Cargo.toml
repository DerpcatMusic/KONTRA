[profile.release]
panic = "unwind"
lto = "thin"
strip = "symbols"

# The corpus-health scoreboard: release code, with function names kept so a
# panic is recorded as crate::module::fn (cargo build --profile corpus).
[profile.corpus]
inherits = "release"
strip = "none"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[profile.dsp-dev]
inherits = "dev"
opt-level = 1

# Explicit ThinLTO profile for comparisons with maxperf.
[profile.thin]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.minsize]
inherits = "maxperf"
opt-level = "s"

[patch.crates-io]
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }

[workspace]
members = ["tools/xtask", "tools/inspect", "tools/ui-shots", "tools/kontra-window", "crates/app/align", "crates/app/host", "crates/app/library", "crates/app/ui", "crates/app/ui-pictures", "crates/base/law", "crates/base/macros", "crates/base/time", "crates/dsp/core", "crates/dsp/delay", "crates/dsp/drive", "crates/dsp/dynamics", "crates/dsp/eq", "crates/dsp/filter", "crates/dsp/modulators", "crates/dsp/registry", "crates/dsp/reverb", "crates/dsp/spatial", "crates/engine/behaviour", "crates/engine/effects", "crates/engine/engine", "crates/engine/ledger", "crates/engine/plan", "crates/engine/prepare", "crates/engine/racks", "crates/engine/script-ui", "crates/engine/stream", "crates/engine/trace", "crates/engine/vm", "crates/engine/voice", "crates/format/common", "crates/format/kontakt", "crates/format/native", "crates/format/sfz", "crates/format/uvi", "crates/model/events", "crates/model/ir", "crates/model/params", "crates/model/protocol", "crates/model/ui-model", "crates/script/ksp", "crates/script/lua", "plugin"]
exclude = ["vendor/ni-file", "vendor/ncw", "vendor/uvi-file", "vendor/symphonia-format-riff", "vendor/symphonia-bundle-flac", "vendor/derpcat-flight-recorder", "vendor/buffr-durable-file"]
resolver = "3"

[workspace.package]
edition = "2024"

# Versions match Cargo.lock today. Later v3 tasks depend on these with `workspace = true`.
[workspace.dependencies]
mui = { git = "https://github.com/Matari-Audio/MUI", rev = "1d7e29cb567289ba73023b04820a6995b7dc853f" }
mui-native-dialog = { git = "https://github.com/Matari-Audio/MUI", rev = "1d7e29cb567289ba73023b04820a6995b7dc853f" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "ac856c84ba9c53ef5069baffe70404b9969958c2", default-features = false }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "ac856c84ba9c53ef5069baffe70404b9969958c2" }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "ac856c84ba9c53ef5069baffe70404b9969958c2" }
moose-test = { git = "https://github.com/Matari-Audio/moose", rev = "ac856c84ba9c53ef5069baffe70404b9969958c2" }
moose-standalone = { git = "https://github.com/Matari-Audio/moose", rev = "ac856c84ba9c53ef5069baffe70404b9969958c2" }
thiserror = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
syn = { version = "2", features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"

# New v3 crates inherit these (`[lints] workspace = true`). Old crates keep their own lints until they move.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Optimized CI keeps release semantics while avoiding cross-crate ThinLTO.
[profile.ci]
inherits = "release"
lto = false

# Local "release-like" iteration (09-BUILD.md). Shipping, CI and benchmarks use release/maxperf.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = "none"
debug = "line-tables-only"
