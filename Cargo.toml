[profile.release]
panic = "unwind"
lto = "thin"
strip = "symbols"

# The corpus-health scoreboard: release code, with function names kept so a
# panic is recorded as crate::module::fn (cargo build --profile corpus).
[profile.corpus]
inherits = "release"
strip = "none"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[profile.dsp-dev]
inherits = "dev"
opt-level = 1

# Explicit ThinLTO profile for comparisons with maxperf.
[profile.thin]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.minsize]
inherits = "maxperf"
opt-level = "s"

[patch."https://github.com/Matari-Audio/moose"]
moose-mui = { path = "vendor/moose-mui" }
# Host output port names that follow the routing; see vendor/MOOSE-PATCHES.md.
moose-params = { path = "vendor/moose-params" }
moose-derive = { path = "vendor/moose-derive" }
moose-clap = { path = "vendor/moose-clap" }
moose-vst3 = { path = "vendor/moose-vst3" }

# MUI's vello with a fix for images vanishing after a partial redraw; see vendor/vello/PATCHES.md.
[patch."https://github.com/Matari-Audio/MUI"]
mui = { path = "vendor/mui" }
moose-baseview = { path = "vendor/moose-baseview" }
vello = { path = "vendor/vello" }
mui-vello = { path = "vendor/mui-vello" }
# moose-mui uses the distinct local kontra-native-host package. Keep upstream
# mui-baseview available for its shared native accessibility and IME bridges.

[patch.crates-io]
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }

[workspace]
members = ["vendor/mui", "vendor/mui-vello", "tools/xtask", "tools/inspect", "tools/ui-shots", "tools/kontra-window", "vendor/moose-mui", "vendor/moose-params", "vendor/moose-derive", "vendor/moose-clap", "vendor/moose-vst3", "vendor/mui-baseview", "crates/app/align", "crates/app/host", "crates/app/library", "crates/app/ui", "crates/app/ui-pictures", "crates/base/law", "crates/base/macros", "crates/base/time", "crates/dsp/core", "crates/dsp/delay", "crates/dsp/drive", "crates/dsp/dynamics", "crates/dsp/eq", "crates/dsp/filter", "crates/dsp/modulators", "crates/dsp/registry", "crates/dsp/reverb", "crates/dsp/spatial", "crates/engine/behaviour", "crates/engine/effects", "crates/engine/engine", "crates/engine/ledger", "crates/engine/plan", "crates/engine/prepare", "crates/engine/script-ui", "crates/engine/stream", "crates/engine/trace", "crates/engine/vm", "crates/engine/voice", "crates/format/common", "crates/format/kontakt", "crates/format/native", "crates/format/sfz", "crates/format/uvi", "crates/model/events", "crates/model/ir", "crates/model/params", "crates/model/protocol", "crates/model/ui-model", "crates/script/ksp", "crates/script/lua", "plugin"]
exclude = ["vendor/ni-file", "vendor/ncw", "vendor/uvi-file", "vendor/vello", "vendor/moose-baseview", "vendor/xim-rs", "vendor/symphonia-format-riff", "vendor/symphonia-bundle-flac", "vendor/derpcat-flight-recorder", "vendor/buffr-durable-file"]
resolver = "3"

[workspace.package]
edition = "2024"

# Versions match Cargo.lock today. Later v3 tasks depend on these with `workspace = true`.
[workspace.dependencies]
thiserror = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
syn = { version = "2", features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"

# New v3 crates inherit these (`[lints] workspace = true`). Old crates keep their own lints until they move.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Optimized CI keeps release semantics while avoiding cross-crate ThinLTO.
[profile.ci]
inherits = "release"
lto = false

# Local "release-like" iteration (09-BUILD.md). Shipping, CI and benchmarks use release/maxperf.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = "none"
debug = "line-tables-only"
