[package]
name = "kontakto"
version = "0.3.403"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "KONTRA: a Kontakt-compatible sampler (CLAP, VST3, standalone)"
repository = "https://github.com/DerpcatMusic/KONTRA"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["plugin", "clap", "vst3", "library-access"]
# Opens protected Kontakt and UVI library content through native readers.
library-access = ["sampler-kontakt/library-access", "sampler-uvi/library-access"]
plugin = ["sampler-kontakt/native-ui", "dep:moose", "dep:mui", "dep:png", "dep:rfd", "dep:mui-native-dialog", "dep:mui-text", "dep:zune-jpeg", "dep:mlua", "dep:image-webp", "dep:resvg"]
clap = ["plugin", "dep:moose-clap", "dep:clap-sys"]
vst3 = ["plugin", "dep:moose-vst3"]
standalone = ["plugin", "dep:moose-standalone"]
# `audit-ui --shots`: draws views with the CPU renderer (kept out of the plugin).
shots = ["plugin", "dep:mui", "sampler-ksp/scan", "sampler-kontakt/scan", "sampler-uvi/scan"]

[dependencies]
sampler-core = { path = "crates/sampler-core" }
sampler-ir = { path = "crates/sampler-ir" }
sampler-kontakt = { path = "crates/sampler-kontakt", default-features = false }
sampler-midi = { path = "crates/sampler-midi" }
sampler-uvi = { path = "crates/sampler-uvi", default-features = false }
sampler-ksp = { path = "crates/sampler-ksp" }
sampler-ui-ir = { path = "crates/sampler-ui-ir" }
rustc-hash = "=2.1.3"
anyhow = "1"
png = { version = "0.18", optional = true }
mlua = { version = "0.12.2", optional = true, features = ["luau", "error-send"] }
image-webp = { version = "0.2.4", optional = true }
resvg = { version = "0.46.0", default-features = false, optional = true }
ni-file = { path = "vendor/ni-file", features = ["serde"] }
ncw = { path = "vendor/ncw" }
crossbeam-queue = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["aiff", "wav", "pcm"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3.5"
walkdir = "2"
# Kontakt NKI export compresses the preset the way Kontakt does.
fastlz = "0.1"
dirs = "5"
blake3 = "1.8.7"
getrandom = "0.4.3"
sha2 = "0.10.9"
tempfile = "3"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
derpcat-flight-recorder = { path = "vendor/derpcat-flight-recorder" }
buffr-durable-file = { path = "vendor/buffr-durable-file" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", default-features = false, features = ["mui"], optional = true }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", features = ["mpe-input"], optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
moose-standalone = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", features = ["gui", "playback"], optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { git = "https://github.com/Matari-Audio/MUI", features = ["cpu", "reporting"], optional = true }
# Library covers: the name typeset from the bundled font, and JPEG artwork the player picks.
mui-text = { git = "https://github.com/Matari-Audio/MUI", optional = true }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
mui-native-dialog = { git = "https://github.com/Matari-Audio/MUI", features = ["xdg-portal"], optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }

# Stream rings hand idle pages back (madvise).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[[bin]]
name = "kontakto"
path = "src/create_library.rs"

[[bin]]
name = "kontakto-standalone"
path = "src/standalone.rs"
required-features = ["standalone"]

[[example]]
name = "kontra_scan"
required-features = ["shots"]

# panic stays "unwind": a plugin must not abort the host, and the importer
# catches parser panics. Fat LTO with one codegen unit measured no faster than
# ThinLTO on the synthetic and real-library benches, at four times the build.
# For a trained build see tools/pgo.sh.
[profile.release]
panic = "unwind"
lto = "thin"
strip = "symbols"

# The corpus-health scoreboard: release code, with function names kept so a
# panic is recorded as crate::module::fn (cargo build --profile corpus).
[profile.corpus]
inherits = "release"
strip = "none"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[profile.dsp-dev]
inherits = "dev"
opt-level = 1

# Explicit ThinLTO profile for comparisons with maxperf.
[profile.thin]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.minsize]
inherits = "maxperf"
opt-level = "s"

[dev-dependencies]
mui = { git = "https://github.com/Matari-Audio/MUI", features = ["cpu"] }
moose-test = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497" }

[patch."https://github.com/Matari-Audio/moose"]
moose-mui = { path = "vendor/moose-mui" }
# Host output port names that follow the routing; see vendor/MOOSE-PATCHES.md.
moose-params = { path = "vendor/moose-params" }
moose-derive = { path = "vendor/moose-derive" }
moose-clap = { path = "vendor/moose-clap" }
moose-vst3 = { path = "vendor/moose-vst3" }

# MUI's vello with a fix for images vanishing after a partial redraw; see vendor/vello/PATCHES.md.
[patch."https://github.com/Matari-Audio/MUI"]
mui = { path = "vendor/mui" }
moose-baseview = { path = "vendor/moose-baseview" }
vello = { path = "vendor/vello" }
mui-vello = { path = "vendor/mui-vello" }
# moose-mui uses the distinct local kontra-native-host package. Keep upstream
# mui-baseview available for its shared native accessibility and IME bridges.

[patch.crates-io]
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }

[workspace]
members = ["vendor/mui-vello", ".", "crates/sampler-core", "crates/sampler-native", "crates/sampler-perf", "crates/sampler-midi", "crates/sampler-ksp", "crates/sampler-kontakt", "crates/sampler-ui-ir", "crates/sampler-ir", "crates/sampler-simd", "crates/sampler-pool", "crates/sampler-uvi", "tools/corpus-health", "vendor/moose-mui", "vendor/moose-params", "vendor/moose-derive", "vendor/moose-clap", "vendor/moose-vst3", "vendor/mui-baseview"]
exclude = ["vendor/mui", "vendor/ni-file", "vendor/ncw", "vendor/vello", "vendor/moose-baseview", "vendor/xim-rs", "vendor/symphonia-format-riff", "vendor/derpcat-flight-recorder", "vendor/buffr-durable-file"]
resolver = "3"

# Optimized CI keeps release semantics while avoiding cross-crate ThinLTO.
[profile.ci]
inherits = "release"
lto = false

[[example]]
name = "uvi_ui_health"
required-features = ["shots"]

[[example]]
name = "uvi_audit_pcm"
required-features = ["shots"]

[[example]]
name = "ui_health"
required-features = ["shots"]
