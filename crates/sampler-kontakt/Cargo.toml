[package]
name = "sampler-kontakt"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[features]
scan = ["sampler-ksp/scan"]
default = ["library-access"]
# Reads a library's own .nicnt access data to open its encrypted content.
library-access = ["dep:aes"]
# The host consumes legacy .nui requests through its authored renderer.
native-ui = []

[[example]]
name = "ksp_fault_kinds"
required-features = ["scan"]

[dependencies]
anyhow = "1"
symphonia = { version = "0.5", default-features = false, features = ["aiff", "wav", "pcm"] }
sampler-ir = { path = "../sampler-ir", features = ["cache"] }
sampler-core = { path = "../sampler-core" }
sampler-ksp = { path = "../sampler-ksp", features = ["cache"] }
sampler-ui-ir = { path = "../sampler-ui-ir" }
ni-file = { path = "../../vendor/ni-file" }
ncw = { path = "../../vendor/ncw" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = { version = "0.8", optional = true }

[lints.rust]
unsafe_code = "deny" # Library forbids it; test allocator instrumentation opts out.
