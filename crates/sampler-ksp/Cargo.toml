[package]
name = "sampler-ksp"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[features]
# Read-only compiler phase observations for the shared scanner.
scan = []
cache = ["dep:serde", "sampler-core/cache"]

[dependencies]
sampler-parity = { path = "../sampler-parity" }
sampler-core = { path = "../sampler-core" }
sampler-ir = { path = "../sampler-ir" }
sampler-ui-ir = { path = "../sampler-ui-ir" }
sampler-script = { path = "../sampler-script" }
mlua = { version = "=0.12.2", features = ["luau"] }
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10.9"
rustc-hash = "=2.1.3"

[lints.rust]
unsafe_code = "deny"
