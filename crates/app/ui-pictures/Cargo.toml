[package]
name = "kontra-ui-pictures"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
dirs = "5"
kontra-library = { version = "0.0.0", path = "../library" }
kontra-ui-model = { path = "../../model/ui-model" }
mui = { workspace = true }
image-webp = "0.2.4"
png = "0.18"
peniko = "0.6.1"
resvg = { version = "0.50.0", default-features = false }
sha2 = "0.10.9"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
