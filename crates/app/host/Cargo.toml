[package]
name = "kontra-host"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kontra-engine = { path = "../../engine/engine" }
kontra-prepare = { path = "../../engine/prepare" }
kontra-format = { path = "../../format/common" }
kontra-format-kontakt = { path = "../../format/kontakt" }
kontra-format-native = { path = "../../format/native" }
kontra-format-sfz = { path = "../../format/sfz" }
kontra-format-uvi = { path = "../../format/uvi" }
kontra-ksp = { path = "../../script/ksp" }
kontra-library = { path = "../library" }
kontra-lua = { path = "../../script/lua" }
kontra-protocol = { path = "../../model/protocol" }
kontra-stream = { path = "../../engine/stream" }
kontra-ui-model = { path = "../../model/ui-model" }
dirs = "5"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
kontra-align = { path = "../align", optional = true }

[features]
align = ["dep:kontra-align"]

[[example]]
name = "align"
required-features = ["align"]
