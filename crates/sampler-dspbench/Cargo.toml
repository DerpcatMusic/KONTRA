[package]
name = "sampler-dspbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Head-to-head DSP bake-off: our blocks vs candidate implementations, scored on CPU, quality and Kontakt fidelity"
publish = false

[[bin]]
name = "dspbench"
path = "src/main.rs"

[features]
# Third-party candidate implementations. The shipping build never enables this.
candidates = ["dep:biquad", "dep:rubato"]

[dependencies]
sampler-core = { path = "../sampler-core", features = ["dspbench"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
biquad = { version = "0.6", optional = true }
rubato = { version = "5", optional = true }

[lints.rust]
unsafe_code = "deny"
