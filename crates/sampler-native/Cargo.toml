[package]
name = "sampler-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[dependencies]
sampler-core = { path = "../sampler-core" }
sampler-midi = { path = "../sampler-midi" }
sampler-ksp = { path = "../sampler-ksp" }
sampler-kontakt = { path = "../sampler-kontakt", default-features = false }
sampler-ir = { path = "../sampler-ir" }
sampler-uvi = { path = "../sampler-uvi", default-features = false }
serde_json = "1"
dirs = "5"
roxmltree = "=0.21.1"

[features]
default = ["library-access"]
library-access = ["sampler-kontakt/library-access", "sampler-uvi/library-access"]

[lints.rust]
unsafe_code = "forbid"
