[package]
name = "sampler-perf"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[dependencies]
sampler-core = { path = "../sampler-core" }
sampler-midi = { path = "../sampler-midi" }
sampler-ir = { path = "../sampler-ir" }
sampler-kontakt = { path = "../sampler-kontakt" }
sampler-uvi = { path = "../sampler-uvi" }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
# Same pinned Luau build as sampler-uvi, to prove the counter sees Luau allocations.
mlua = { version = "=0.12.2", features = ["luau"] }

[lints.rust]
unsafe_code = "deny" # Only the counting allocator in main.rs opts out.
