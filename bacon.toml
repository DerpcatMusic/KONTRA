default_job = "check"
env.CARGO_TARGET_DIR = "artifacts/check"
env.CARGO_BUILD_JOBS = "4"

[jobs.check]
command = ["cargo", "check", "--lib"]
watch = ["vendor"]
need_stdout = false

# Explicitly selected; normal editing never launches tests.
[jobs.parity]
command = ["cargo", "nextest", "run", "--lib", "--no-default-features", "--features", "library-access", "-E", "test(midi_channels_survive_waits_and_release_independently) | test(global_ui_callbacks_and_custom_event_data_reach_their_consumers) | test(zone_sized_tables_and_compilation_cache_follow_the_instrument)"]
analyzer = "nextest"
need_stdout = true
env.RUST_MIN_STACK = "16777216"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--features", "standalone"]
watch = ["vendor"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--release"]
watch = ["vendor"]
analyzer = "nextest"
need_stdout = true
